<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - RoStudio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #050505;
            color: #ffffff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* ==================== ANIMATED STARFIELD ==================== */
        #starfield {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            background: #050505;
            overflow: hidden;
        }
        .star {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
            box-shadow: 0 0 6px 2px rgba(255, 255, 255, 0.1);
        }
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* ==================== MAIN CONTAINER ==================== */
        .signup-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ==================== LOGO ==================== */
        .logo-area {
            margin-bottom: 32px;
        }
        .logo-icon {
            width: 64px;
            height: 64px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.05);
        }
        .logo-icon-inner {
            width: 40px;
            height: 40px;
            background: radial-gradient(circle at 30% 30%, #a855f7, #6d28d9);
            border-radius: 50%;
        }

        /* ==================== TYPOGRAPHY ==================== */
        h1 {
            font-size: 40px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }
        .subtitle {
            font-size: 16px;
            color: #9ca3af;
            margin-bottom: 32px;
        }

        /* ==================== OAUTH BUTTONS ==================== */
        .oauth-btn {
            width: 100%;
            padding: 14px 20px;
            border-radius: 12px;
            border: 1px solid #27272a;
            background: #18181b;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.2s ease;
            margin-bottom: 12px;
            font-family: 'Inter', sans-serif;
        }
        .oauth-btn:hover {
            background: #27272a;
            border-color: #3f3f46;
            transform: translateY(-2px);
        }
        .oauth-btn:active {
            transform: scale(0.98);
        }

        .oauth-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .google-icon svg { width: 20px; height: 20px; }
        .roblox-icon svg { width: 20px; height: 20px; fill: #ffffff; }

        /* ==================== FOOTER TEXT ==================== */
        .legal-text {
            font-size: 13px;
            color: #6b7280;
            margin-top: 16px;
            line-height: 1.5;
        }
        .legal-text a {
            color: #a855f7;
            text-decoration: none;
            transition: 0.2s;
        }
        .legal-text a:hover {
            text-decoration: underline;
        }

        .login-link {
            margin-top: 24px;
            font-size: 15px;
            color: #9ca3af;
        }
        .login-link a {
            color: #a855f7;
            text-decoration: none;
            font-weight: 500;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- STARFIELD -->
    <div id="starfield"></div>

    <!-- SIGNUP CONTENT -->
    <div class="signup-container">
        
        <div class="logo-area">
            <div class="logo-icon">
                <div class="logo-icon-inner"></div>
            </div>
        </div>

        <h1>Create An<br>Account</h1>
        <p class="subtitle">Begin your journey to the moon</p>

        <a href="/auth/google" style="text-decoration: none; width: 100%;">
            <button class="oauth-btn">
                <span class="oauth-icon google-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M23.52 12.29C23.52 11.44 23.44 10.62 23.3 9.83H12V14.5H18.47C18.19 15.97 17.35 17.22 16.11 18.08V21.02H19.94C22.2 18.93 23.52 15.87 23.52 12.29Z" fill="#4285F4"/>
                        <path d="M12 24C15.24 24 17.96 22.92 19.94 21.02L16.11 18.08C14.98 18.83 13.61 19.27 12 19.27C8.87 19.27 6.22 17.15 5.23 14.32H1.22V17.38C3.18 21.25 7.33 24 12 24Z" fill="#34A853"/>
                        <path d="M5.23 14.32C4.96 13.52 4.82 12.67 4.82 11.82C4.82 10.97 4.96 10.12 5.23 9.32V6.26H1.22C0.44 7.81 0 9.57 0 11.5C0 13.43 0.44 15.19 1.22 16.74L5.23 14.32Z" fill="#FBBC05"/>
                        <path d="M12 4.73C13.77 4.73 15.35 5.35 16.57 6.52L20.03 3.06C17.96 1.15 15.24 0 12 0C7.33 0 3.18 2.75 1.22 6.62L5.23 9.68C6.22 6.85 8.87 4.73 12 4.73Z" fill="#EA4335"/>
                    </svg>
                </span>
                Continue with Google
            </button>
        </a>

        <a href="/auth/roblox" style="text-decoration: none; width: 100%;">
            <button class="oauth-btn">
                <span class="oauth-icon roblox-icon">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L2 7.5L12 13L22 7.5L12 2ZM2 17L12 22.5L22 17V9.5L12 15L2 9.5V17Z"/>
                    </svg>
                </span>
                Continue with Roblox
            </button>
        </a>

        <p class="legal-text">
            By continuing, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
        </p>

        <p class="login-link">
            Already have an account? <a href="#">Log in</a>
        </p>
    </div>

    <script>
        // ==================== STARFIELD GENERATOR ====================
        const starfield = document.getElementById('starfield');
        const starCount = 300;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 2 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            star.style.animationDelay = Math.random() * 5 + 's';
            starfield.appendChild(star);
        }
    </script>
</body>
</html>
