<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoStudio - Build with AI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #050505;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* ==================== PREMIUM BACKGROUND ==================== */
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: 
                radial-gradient(ellipse 80% 60% at 50% 0%, rgba(88, 28, 135, 0.4) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 80% 20%, rgba(126, 34, 206, 0.25) 0%, transparent 50%),
                radial-gradient(ellipse 50% 40% at 20% 80%, rgba(107, 33, 168, 0.15) 0%, transparent 50%),
                #050505;
        }

        /* Dot Grid Pattern */
        .bg-layer::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(circle, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
        }

        /* Floating Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            opacity: 0.4;
            animation: floatOrb 20s infinite alternate ease-in-out;
        }
        .orb-1 {
            width: 400px; height: 400px;
            background: #7c3aed;
            top: -100px; right: -100px;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 300px; height: 300px;
            background: #a855f7;
            bottom: -50px; left: -50px;
            animation-delay: -7s;
        }
        .orb-3 {
            width: 200px; height: 200px;
            background: #6d28d9;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -14s;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(10px, -10px) scale(1.05); }
        }

        /* ==================== TOP NAV ==================== */
        .top-nav {
            position: relative;
            z-index: 50;
            width: 100%;
            padding: 20px 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(12px);
            background: rgba(5, 5, 5, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
        }
        .logo-icon {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, #a855f7, #6d28d9);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 32px;
            margin-right: 32px;
        }
        .nav-links a {
            color: #9ca3af;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.2s ease;
            position: relative;
        }
        .nav-links a:hover { color: #fff; }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px; left: 0;
            width: 0; height: 2px;
            background: #a855f7;
            transition: width 0.3s ease;
        }
        .nav-links a:hover::after { width: 100%; }

        .nav-btn {
            background: #ffffff;
            color: #050505;
            border: none;
            padding: 10px 24px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }
        .nav-btn:hover { 
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(255, 255, 255, 0.2);
        }

        /* ==================== MAIN CONTENT ==================== */
        .main-container {
            position: relative;
            z-index: 10;
            width: 100%; max-width: 1000px;
            margin: 0 auto;
            padding: 80px 20px 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .beta-badge {
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.2);
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 12px;
            color: #c084fc;
            letter-spacing: 1px;
            margin-bottom: 24px;
            text-transform: uppercase;
            font-weight: 600;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.05);
        }

        .hero-title {
            font-size: 76px;
            line-height: 1.05;
            font-weight: 800;
            text-align: center;
            letter-spacing: -0.03em;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #a855f7 0%, #d8b4fe 30%, #ffffff 70%, #a855f7 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 4s linear infinite;
        }

        @keyframes shimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .hero-subtitle {
            font-size: 20px;
            color: #9ca3af;
            text-align: center;
            font-weight: 400;
            margin-bottom: 48px;
        }

        /* ==================== THE BIG INPUT AREA ==================== */
        .chat-input-container {
            width: 100%;
            background: rgba(23, 23, 26, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        .chat-input-container:focus-within {
            border-color: rgba(168, 85, 247, 0.4);
            box-shadow: 0 20px 60px rgba(168, 85, 247, 0.15);
            background: rgba(23, 23, 26, 0.9);
        }

        .input-left-icon {
            color: #9ca3af;
            font-size: 20px;
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            transition: 0.2s;
            background: rgba(255, 255, 255, 0.05);
        }
        .input-left-icon:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }

        .main-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 18px;
            font-family: 'Inter', sans-serif;
            outline: none;
            height: 32px;
        }
        .main-input::placeholder { color: #52525b; }

        .send-btn {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: #fff;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.2);
        }
        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(124, 58, 237, 0.4);
        }
        .send-btn svg { width: 22px; height: 22px; fill: currentColor; }
    </style>
</head>
<body>

    <!-- PREMIUM BACKGROUND -->
    <div class="bg-layer">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- TOP NAV -->
    <nav class="top-nav">
        <div class="logo-area">
            <div class="logo-icon">🤖</div>
            ROSTUDIO
        </div>
        <div style="display: flex; align-items: center;">
            <div class="nav-links">
                <a href="#">How it works</a>
                <a href="#">FAQ</a>
                <a href="#">Pricing</a>
            </div>
            <button class="nav-btn" onclick="window.location.href='/dashboard'">Start for Free</button>
        </div>
    </nav>

    <!-- MAIN HERO -->
    <div class="main-container">
        <div class="beta-badge">Beta</div>
        
        <h1 class="hero-title">
            Build what you<br>
            can't build alone.
        </h1>
        
        <p class="hero-subtitle">Describe a system or an interface. RoStudio builds it.</p>
        
        <div class="chat-input-container">
            <span class="input-left-icon">+</span>
            <input type="text" class="main-input" id="homeInput" placeholder="Describe a system or an interface..." />
            <button class="send-btn" onclick="goToDashboardWithPrompt()">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>

    <script>
        function goToDashboardWithPrompt() {
            const val = document.getElementById('homeInput').value;
            sessionStorage.setItem('prefillPrompt', val);
            window.location.href = '/dashboard';
        }

        document.getElementById('homeInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') goToDashboardWithPrompt();
        });
    </script>
</body>
</html>
